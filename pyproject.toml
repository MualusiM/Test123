[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psychro-chart-app"
version = "0.1.0"
description = "A PyQt and Matplotlib psychrometric chart explorer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "PsychroLib",
    "PyQt6",
]

[project.scripts]
psychro-chart = "psychro_chart_app.main:main"

[tool.setuptools.packages.find]
include = ["psychro_chart_app*"]
